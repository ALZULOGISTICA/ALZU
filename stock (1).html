<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1221">
<title>ALZU · Consultá tu stock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">

<!-- ════════════════════════════════════════════
     FIREBASE · mismo proyecto que el panel ALZU.
     Lee alzu/data en tiempo real (listas + productos).
     Cada lista tiene una contraseña (pin) de 4 dígitos.
══════════════════════════════════════════════ -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, onSnapshot, getDoc }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyCmmzx6Y329MwI58DluD9u75TjI9MEOY4E",
    authDomain: "alzu-915ed.firebaseapp.com",
    projectId: "alzu-915ed",
    storageBucket: "alzu-915ed.firebasestorage.app",
    messagingSenderId: "278250201847",
    appId: "1:278250201847:web:33d04b49ad7070c55529f2"
  };

  const app = initializeApp(FIREBASE_CONFIG);
  const db  = getFirestore(app);
  const REF = doc(db, 'alzu', 'data');

  // Carga inicial
  getDoc(REF).then(snap => {
    if (snap.exists()) { window._ALZU_DATA = snap.data(); window.onAlzuData && window.onAlzuData(); }
  }).catch(e => console.warn('Lectura inicial:', e));

  // Tiempo real: el stock se mantiene actualizado solo
  onSnapshot(REF,
    (snap) => { if (snap.exists()) { window._ALZU_DATA = snap.data(); window.onAlzuData && window.onAlzuData(); } },
    (err)  => console.warn('Firestore listen:', err)
  );

  window.dispatchEvent(new Event('alzu-ready'));
</script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b1221; --panel:#0d1526; --line:#1e2d4a;
  --t1:#f1f5f9; --t2:#94a3b8; --t3:#5b6b83; --t4:#33415c;
  --red:#e8192c; --red3:#fb7185;
  --ok:#34d399; --warn:#fbbf24;
  --font:'DM Sans',system-ui,sans-serif; --mono:'DM Mono',ui-monospace,monospace; --disp:'Syne',sans-serif;
}
html,body{background:var(--bg);color:var(--t1)}
body{
  font-family:var(--font);font-size:14px;line-height:1.5;min-height:100dvh;
  background:
    radial-gradient(1100px 520px at 88% -8%, rgba(232,25,44,.10), transparent 60%),
    radial-gradient(900px 480px at -6% 4%, rgba(59,130,246,.07), transparent 55%),
    var(--bg);
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:6px}
button{font-family:inherit;cursor:pointer}

/* ── HEADER ── */
.hd{position:sticky;top:0;z-index:30;background:rgba(8,13,26,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hd-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:1rem;padding:.85rem clamp(1rem,4vw,2rem)}
.brand .lg{font-family:var(--disp);font-weight:800;font-size:1.3rem;letter-spacing:.02em}
.brand .lg em{color:var(--red);font-style:normal}
.brand .sb{font-size:.55rem;letter-spacing:.26em;text-transform:uppercase;color:var(--t3);margin-top:4px;font-weight:600}
.hd-pin{margin-left:auto;display:flex;gap:.5rem;align-items:center}
.hd-pin input{width:120px;text-align:center;font-family:var(--mono);font-size:1rem;letter-spacing:.25rem;background:#111827;border:1.5px solid var(--line);border-radius:8px;padding:.5rem;color:#fff;outline:none}
.hd-pin input:focus{border-color:var(--red3)}
.hd-pin button{background:var(--red);color:#fff;border:none;border-radius:8px;padding:.55rem .9rem;font-weight:700;font-size:.8rem}

/* ── WRAP ── */
.wrap{max-width:1180px;margin:0 auto;padding:clamp(1rem,4vw,2rem)}

/* ── HERO / EMPTY STATE ── */
.hero{text-align:center;padding:clamp(2rem,8vw,4.5rem) 1rem 2rem}
.hero .big{font-family:var(--disp);font-weight:800;font-size:clamp(1.6rem,6vw,2.4rem);letter-spacing:.02em;margin-bottom:.4rem}
.hero .big em{color:var(--red);font-style:normal}
.hero p{color:var(--t2);font-size:.92rem;max-width:440px;margin:0 auto 1.8rem;line-height:1.6}
.pinbox{max-width:300px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:1.6rem 1.4rem}
.pinbox label{display:block;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--t3);margin-bottom:.7rem;font-weight:700}
.pinbox input{width:100%;text-align:center;font-size:2rem;letter-spacing:.6rem;font-family:var(--mono);background:#111827;border:2px solid var(--line);border-radius:12px;padding:.75rem;color:#fff;outline:none;margin-bottom:1rem}
.pinbox input:focus{border-color:var(--red3)}
.pinbox button{width:100%;background:var(--red);color:#fff;border:none;border-radius:10px;padding:.85rem;font-size:.9rem;font-weight:700;letter-spacing:.04em}
.pin-err{font-size:.78rem;color:var(--red3);min-height:1.2rem;margin-bottom:.6rem}
.hint{font-size:.72rem;color:var(--t4);margin-top:1.1rem}

/* ── LISTA SECTION ── */
.lsec{background:var(--panel);border:1px solid var(--line);border-radius:16px;margin-bottom:1.5rem;overflow:hidden}
.lsec-h{padding:1.1rem 1.3rem;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.lsec-ic{width:44px;height:44px;border-radius:11px;background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.3);display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0}
.lsec-h h2{font-size:1.1rem;font-weight:800;letter-spacing:.02em}
.lsec-h .sub{font-size:.68rem;color:var(--t3);margin-top:2px}
.lsec-h .cnt{color:#60a5fa}
.lsec-x{margin-left:auto;background:none;border:1px solid var(--line);color:var(--t3);border-radius:8px;width:30px;height:30px;font-size:.9rem;display:flex;align-items:center;justify-content:center}
.lsec-x:hover{color:var(--red3);border-color:var(--red3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.8rem;padding:1.2rem 1.3rem}
@media(max-width:480px){.grid{grid-template-columns:repeat(2,1fr);gap:.6rem;padding:.9rem}}
.card{background:#111827;border:1px solid var(--line);border-radius:11px;overflow:hidden}
.card-img{height:120px;background:#0a0f1e;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:cover}
.card-img .emo{font-size:2.2rem}
.card-b{padding:9px 11px}
.card-n{font-size:.82rem;font-weight:700;color:#e2e8f0;margin-bottom:4px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.1em}
.card-f{display:flex;align-items:center;justify-content:space-between;gap:4px}
.card-q{font-size:1.15rem;font-weight:800;color:#fff}
.card-q .u{font-size:.6rem;color:var(--t3);margin-left:2px;font-weight:600}
.bdg{font-size:.58rem;padding:2px 7px;border-radius:10px;font-weight:700;white-space:nowrap}
.b-ok{background:rgba(52,211,153,.15);color:var(--ok)}
.b-warn{background:rgba(251,191,36,.15);color:var(--warn)}
.b-red{background:rgba(232,25,44,.15);color:var(--red3)}
.foot{text-align:center;color:var(--t4);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;padding:2rem 1rem 3rem}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(120%);background:#111827;border:1px solid var(--line);color:#fff;padding:.7rem 1.2rem;border-radius:10px;font-size:.82rem;transition:transform .3s;z-index:100;max-width:90vw;text-align:center}
.toast.on{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="hd">
  <div class="hd-in">
    <div class="brand">
      <div class="lg">ALZU<em>.</em></div>
      <div class="sb">Consulta de Stock</div>
    </div>
    <div class="hd-pin" id="hd-pin" style="display:none">
      <input id="pin-top" maxlength="40" placeholder="clave" autocomplete="off" onkeydown="if(event.key==='Enter')unlock('top')">
      <button onclick="unlock('top')">Abrir</button>
    </div>
  </div>
</div>

<div class="wrap">
  <!-- estado inicial / sin listas abiertas -->
  <div class="hero" id="hero">
    <div class="big">Consultá tu <em>stock</em></div>
    <p>Ingresá la contraseña de 4 dígitos que te pasó ALZU para ver tu lista de productos con sus fotos y cantidades actualizadas.</p>
    <div class="pinbox">
      <label>Contraseña de la lista</label>
      <input id="pin-main" maxlength="40" placeholder="••••" autocomplete="off" onkeydown="if(event.key==='Enter')unlock('main')">
      <div class="pin-err" id="pin-err"></div>
      <button onclick="unlock('main')">VER STOCK</button>
      <div class="hint" id="conn-hint">Conectando con la nube…</div>
    </div>
  </div>

  <!-- listas desbloqueadas -->
  <div id="unlocked"></div>
</div>

<div class="foot" id="foot" style="display:none">ALZU LOGÍSTICA · VISTA DE SOLO LECTURA · STOCK EN TIEMPO REAL</div>
<div class="toast" id="toast"></div>

<script>
let _ready=false;
const unlocked=new Set();      // ids de listas desbloqueadas
const pinByList={};            // id -> pin (para mensajes)

function qSt(p){
  const qty=Number(p.qty)||0, min=Number(p.min)||0;
  if(qty===0)return{cls:'b-red',lbl:'SIN STOCK'};
  if(qty<=min)return{cls:'b-warn',lbl:'STOCK BAJO'};
  return{cls:'b-ok',lbl:'OK'};
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2600)}

window.onAlzuData=function(){
  _ready=true;
  const hint=document.getElementById('conn-hint');
  if(hint)hint.textContent='✓ Conectado. Ingresá tu contraseña.';
  renderUnlocked(); // refresca lo ya abierto con datos nuevos
};
window.addEventListener('alzu-ready',()=>{ /* módulo listo */ });

function findListaByPin(pin){
  const d=window._ALZU_DATA;
  if(!d||!Array.isArray(d.listas))return null;
  return d.listas.find(l=>String(l.pin||'')===String(pin)) || null;
}

function unlock(which){
  const inp=document.getElementById(which==='top'?'pin-top':'pin-main');
  const err=document.getElementById('pin-err');
  const val=(inp.value||'').trim();
  if(err)err.textContent='';
  if(val.length<1){ if(err)err.textContent='Ingresá la contraseña.'; return; }
  if(!_ready||!window._ALZU_DATA){ if(err)err.textContent='Todavía cargando… probá de nuevo en un segundo.'; toast('Cargando datos…'); return; }

  // ¿Es la CLAVE MAESTRA (la de acceso que se configura en el panel)?
  const master=(window._ALZU_DATA.cfg&&window._ALZU_DATA.cfg.accessKey)?String(window._ALZU_DATA.cfg.accessKey):'';
  if(master && val===master){
    const listas=Array.isArray(window._ALZU_DATA.listas)?window._ALZU_DATA.listas:[];
    if(!listas.length){ toast('No hay listas todavía'); return; }
    let nuevas=0;
    listas.forEach(l=>{ if(!unlocked.has(l.id)){ unlocked.add(l.id); pinByList[l.id]=l.pin; nuevas++; } });
    inp.value='';
    document.getElementById('hero').style.display='none';
    document.getElementById('hd-pin').style.display='flex';
    document.getElementById('foot').style.display='block';
    renderUnlocked();
    toast(nuevas?('🔓 Clave maestra: '+nuevas+' lista'+(nuevas>1?'s':'')+' abierta'+(nuevas>1?'s':'')):'Todas las listas ya están abiertas');
    return;
  }

  const pin=val; // las claves por lista son de 4 dígitos
  const lista=findListaByPin(pin);
  if(!lista){
    if(err)err.textContent='Contraseña incorrecta. Verificá los 4 dígitos.';
    toast('Contraseña incorrecta');
    inp.value=''; inp.focus();
    return;
  }
  inp.value='';
  if(unlocked.has(lista.id)){
    toast('Esa lista ya está abierta');
    document.getElementById('lsec-'+lista.id)?.scrollIntoView({behavior:'smooth',block:'start'});
    return;
  }
  unlocked.add(lista.id);
  pinByList[lista.id]=pin;
  // pasar a modo "abierto": mostrar barra de pin arriba y ocultar hero
  document.getElementById('hero').style.display='none';
  document.getElementById('hd-pin').style.display='flex';
  document.getElementById('foot').style.display='block';
  renderUnlocked();
  toast('Lista "'+(lista.name||'')+'" desbloqueada ✓');
  setTimeout(()=>document.getElementById('lsec-'+lista.id)?.scrollIntoView({behavior:'smooth',block:'start'}),120);
}

function closeLista(id){
  unlocked.delete(id);
  renderUnlocked();
  if(unlocked.size===0){
    document.getElementById('hero').style.display='block';
    document.getElementById('hd-pin').style.display='none';
    document.getElementById('foot').style.display='none';
    setTimeout(()=>document.getElementById('pin-main')?.focus(),60);
  }
}

function renderUnlocked(){
  const cont=document.getElementById('unlocked');
  const d=window._ALZU_DATA||{};
  const listas=Array.isArray(d.listas)?d.listas:[];
  const products=Array.isArray(d.products)?d.products:[];
  // mantener el orden en que se fueron desbloqueando
  const ids=[...unlocked];
  cont.innerHTML=ids.map(id=>{
    const l=listas.find(x=>x.id===id);
    if(!l)return '';
    const prods=products.filter(p=>p.lista===id);
    const cnt=prods.length;
    const cards=cnt? prods.map(p=>{
      const st=qSt(p);
      const img=p.img&&/^https?:\/\//.test(p.img);
      return `<div class="card">
        <div class="card-img">${img?`<img src="${esc(p.img)}" alt="${esc(p.name)}" loading="lazy">`:`<span class="emo">${esc(p.emoji||'📦')}</span>`}</div>
        <div class="card-b">
          <div class="card-n">${esc(p.name)}</div>
          <div class="card-f">
            <span class="card-q">${esc(p.qty)}<span class="u">${esc(p.unit||'u')}</span></span>
            <span class="bdg ${st.cls}">${st.lbl}</span>
          </div>
        </div>
      </div>`;
    }).join('') : `<div style="padding:2rem;text-align:center;color:var(--t3);grid-column:1/-1">Esta lista todavía no tiene productos cargados.</div>`;
    return `<div class="lsec" id="lsec-${id}">
      <div class="lsec-h">
        <div class="lsec-ic">📋</div>
        <div>
          <h2>${esc(l.name||'Lista')}</h2>
          <div class="sub">${esc(l.desc||'Inventario')} · <span class="cnt">${cnt} producto${cnt!==1?'s':''}</span></div>
        </div>
        <button class="lsec-x" onclick="closeLista('${id}')" title="Cerrar lista">✕</button>
      </div>
      <div class="grid">${cards}</div>
    </div>`;
  }).join('');
}

// foco automático al abrir
setTimeout(()=>document.getElementById('pin-main')?.focus(),300);
</script>
</body>
</html>
